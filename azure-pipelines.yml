trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: azure-terraform-secrets # Contains ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID
  - name: terraformVersion
    value: '1.7.5'
  - name: backendRg
    value: 'rg-terraform-state'
  - name: backendStorage
    value: 'tfstatehubspokestg'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: 'hubspoke-pe.terraform.tfstate'

stages:
  - stage: ValidateAndPlan
    displayName: 'Terraform Validate & Plan'
    jobs:
      - job: Plan
        displayName: 'Plan Job'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Setup Environment'

          - script: |
              curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              sudo apt-get update && sudo apt-get install terraform=$(terraformVersion)*
            displayName: 'Install Terraform'

          - script: |
              terraform fmt -check -recursive
            displayName: 'Terraform Format Check'

          - script: |
              terraform init \
                -backend-config="resource_group_name=$(backendRg)" \
                -backend-config="storage_account_name=$(backendStorage)" \
                -backend-config="container_name=$(backendContainer)" \
                -backend-config="key=$(backendKey)"
            displayName: 'Terraform Init'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - script: |
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - publish: $(System.DefaultWorkingDirectory)/tfplan
            artifact: tfplan
            displayName: 'Publish tfplan artifact'

  - stage: Apply
    displayName: 'Terraform Apply (Prod)'
    dependsOn: ValidateAndPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyJob
        displayName: 'Apply Job'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: tfplan
                  displayName: 'Download tfplan'

                - script: |
                    curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                    echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
                    sudo apt-get update && sudo apt-get install terraform=$(terraformVersion)*
                  displayName: 'Install Terraform'

                - script: |
                    terraform init \
                      -backend-config="resource_group_name=$(backendRg)" \
                      -backend-config="storage_account_name=$(backendStorage)" \
                      -backend-config="container_name=$(backendContainer)" \
                      -backend-config="key=$(backendKey)"
                    terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan
                  displayName: 'Terraform Apply'
                  env:
                    ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                    ARM_TENANT_ID: $(ARM_TENANT_ID)
